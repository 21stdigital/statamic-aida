name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_unit_tests:
    name: Run PHPUnit Tests - php@${{ matrix.setup.php }} - statamic@${{ matrix.setup.statamic }} - laravel@${{ matrix.setup.laravel }}
    runs-on: ${{ matrix.setup.os }}

    strategy:
      matrix:
        setup:
          - {
              php: "8.3",
              laravel: "12.*",
              statamic: "5.*",
              testbench: "10.*",
              os: "ubuntu-latest",
            }
          - {
              php: "8.3",
              laravel: "12.*",
              statamic: "6.*",
              testbench: "10.*",
              os: "ubuntu-latest",
            }
          - {
              php: "8.4",
              laravel: "13.*",
              statamic: "6.*",
              testbench: "11.*",
              os: "ubuntu-latest",
            }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: ${{ matrix.setup.php }}
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: Install Composer Dependencies
        run: |
          composer require "laravel/framework:${{ matrix.setup.laravel }}" "statamic/cms:${{ matrix.setup.statamic }}" "orchestra/testbench:${{ matrix.setup.testbench }}" --no-interaction --no-update
          composer install --no-interaction

      - name: Run PHPUnit Tests
        run: composer test

  unit_tests_result:
    name: Unit Tests
    needs: run_unit_tests
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check Matrix Result
        run: |
          if [ "${{ needs.run_unit_tests.result }}" != "success" ]; then
            echo "Unit tests finished with result: ${{ needs.run_unit_tests.result }}"
            exit 1
          fi
